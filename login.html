<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">

    <!-- Link "Esqueci minha senha": fixo em todos os estados (normal, visitado, hover, clicado, foco).
         Fica aqui, depois do styles.css, para nenhuma outra regra conseguir escondê-lo. -->
    <style>
        .container .form-container.sign-in a.link-esqueci,
        .container .form-container.sign-in a.link-esqueci:link,
        .container .form-container.sign-in a.link-esqueci:visited,
        .container .form-container.sign-in a.link-esqueci:active,
        .container .form-container.sign-in a.link-esqueci:focus {
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
            position: static !important;
            width: auto !important;
            height: auto !important;
            overflow: visible !important;
            transform: none !important;
            align-self: flex-start;
            margin: 8px 0 12px;
            color: #1a56db !important;
            font-size: 14px;
            font-weight: 500;
            text-decoration: underline !important;
            cursor: pointer;
        }

        .container .form-container.sign-in a.link-esqueci:hover {
            color: #0f3ea8 !important;
        }
    </style>
    <script defer src="js/script.js"></script>
    <title>Login Page</title>
</head>

<body>
    <header class="topo">
        <div class="logo">
            <a href="index.html">Nome da Empresa</a>
        </div>

        <aside class="sidebar">
            <h2>Gestão Integrada Pro</h2>
            <nav>
                <a href="index.html">Dashboard</a>
                <a href="sobre.html">Sobre</a>
                <a href="planos.html">Planos</a>
            </nav>
        </aside>
    </header>

    <div class="container" id="container">
        <div class="form-container sign-up">
            <form id="form-cadastro">
                <h1>Criar Conta</h1>
                <input type="text" placeholder="Nome">
                <input type="email" placeholder="Email">
                <input type="password" placeholder="Senha">
                <button>Cadastrar</button>
            </form>
        </div>

        <div class="form-container sign-in">
            <form id="form-login">
                <h1>Entrar</h1>
                <input type="email" placeholder="Email">
                <input type="password" placeholder="Senha">
                <a href="recuperar-senha.html" id="esqueci-senha" class="link-esqueci">Esqueci minha senha</a>
                <button>Entrar</button>
            </form>
        </div>

        <div class="toggle-container">
            <div class="toggle">
                <div class="toggle-panel toggle-left">
                    <h1>Bem vindo de volta!</h1>
                    <p>Insira seus dados pessoais para usar todos os recursos do site</p>
                    <button class="hidden" id="login">Entrar</button>
                </div>
                <div class="toggle-panel toggle-right">
                    <h1>Olá, amigo!</h1>
                    <p>Registre-se com seus dados pessoais para usar todos os recursos do site</p>
                    <button class="hidden" id="register">Cadastrar</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
