<!DOCTYPE html>
<html lang="pt-BR">


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Cadastro</title>
        <link rel="stylesheet" href="css/stylesCadastro.css">
    
<body>
    <header class="topo">
        <div class="logo">
            <a href="index.html">Nome da Empresa</a>
        </div>

        <aside class="sidebar">
            <h2>Gestão Integrada Pro</h2>
            <nav>
                <a href="index.html">Dashboard</a>
                <a href="sobre.html">Sobre</a>
                <a href="planos.html">Planos</a>
            </nav>
        </aside>
    </header>

    <div class="container" id="container">
        <!-- FORMULÁRIO DE CADASTRO -->
        <div class="form-container sign-up">
            <form id="form-cadastro" novalidate>
                <h1>Criar Conta</h1>
                <input type="text" id="cad-nome" placeholder="Nome e sobrenome" maxlength="60" autocomplete="name">
                <input type="text" inputmode="numeric" id="cad-cpf" placeholder="Digite seu CPF" maxlength="11">
                <input type="tel" id="cad-telefone" placeholder="Digite seu Telefone" maxlength="13">
                <input type="email" id="cad-email" placeholder="Email" maxlength="80" autocomplete="email">
                <input type="password" id="cad-senha" placeholder="Senha" autocomplete="new-password">
                <input type="password" id="cad-senha-confirmar" placeholder="Confirmar senha" autocomplete="new-password">
                <button type="submit">Cadastrar</button>
            </form>
        </div>

        <!-- FORMULÁRIO DE LOGIN -->
        <div class="form-container sign-in">
            <form id="form-login" novalidate>
                <h1>Entrar</h1>
                <input type="email" id="login-email" placeholder="Email" autocomplete="email">
                <input type="password" id="login-senha" placeholder="Senha" autocomplete="current-password">
                <a href="recuperar-senha.html" id="esqueci-senha" class="link-esqueci">Esqueci minha senha</a>
                <button type="submit">Entrar</button>
            </form>
        </div>

        <!-- PAINEL DE TRANSIÇÃO (SLIDER) -->
        <div class="toggle-container">
            <div class="toggle">
                <div class="toggle-panel toggle-left">
                    <h1>Bem vindo de volta!</h1>
                    <p>Insira seus dados pessoais para usar todos os recursos do site</p>
                    <button class="hidden" id="login">Entrar</button>
                </div>
                <div class="toggle-panel toggle-right">
                    <h1>Olá, amigo!</h1>
                    <p>Registre-se com seus dados pessoais para usar todos os recursos do site</p>
                    <button class="hidden" id="register">Cadastrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ORDEM IMPORTANTE: o comum.js define NOMES_PLANOS_ASSINATURA, emailValido, etc.
         e precisa carregar ANTES do cadastro.js. Sem ele, o iniciarAuth quebra
         e a tela ignora o ?modo=cadastro. -->
    <script src="js/comum.js"></script>
    <script src="js/cadastro.js"></script>
</body>

</html>
